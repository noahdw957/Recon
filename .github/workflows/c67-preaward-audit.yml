name: c67-trajectory
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install pandas numpy yfinance
      - name: Run exact C67 trajectory study
        run: python C67_valley.py
      - name: Show answer
        run: |
          echo "===== C67 TRAJECTORY SUMMARY ====="
          cat C67_trajectory_summary.txt
      - name: Commit results
        run: |
          git config user.name "recon-bot"
          git config user.email "bot@recon.com"
          git add C67_trajectory_results.csv C67_group_stats.csv C67_trajectory_summary.txt market_cache_C67/ 2>/dev/null || true
          git commit -m "C67 pre-event trajectory study" || echo "Nothing new to commit"
          git push || true
