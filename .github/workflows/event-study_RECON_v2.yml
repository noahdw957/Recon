name: RECON daily buy scanner

on:
  workflow_dispatch:

  schedule:
    # 13:15 UTC weekdays = 9:15 AM ET / 6:15 AM PT during daylight time.
    - cron: '15 13 * * 1-5'

  push:
    paths:
      - 'Scraper.py'
      - 'mts_frozen_model_A.json'
      - 'master_zero_purged.csv'
      - '.github/workflows/event-study.yml'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install requests yfinance pandas numpy scipy scikit-learn

      - name: Run RECON
        run: python Scraper.py

      - name: Today's RECON list
        run: |
          echo "=============================="
          echo "RECON BUY TICKERS"
          echo "=============================="
          if [ -s buy_tickers.txt ]; then
            cat buy_tickers.txt
          else
            echo "NO BUYS"
          fi
          echo "=============================="

      - name: Add result to GitHub summary
        run: |
          echo "## RECON BUY TICKERS" >> "$GITHUB_STEP_SUMMARY"
          if [ -s buy_tickers.txt ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat buy_tickers.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**NO BUYS**" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit RECON state and output
        run: |
          git config user.name "recon-bot"
          git config user.email "bot@recon.com"
          git add buy_tickers.txt ReconData/ 2>/dev/null || true
          git commit -m "RECON daily scan" || true
          git push
