name: RECON Historical Event Study
on:
  workflow_dispatch:
jobs:
  event-study:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas requests yfinance
      - name: Run historical event study
        run: |
          ls -R
          if [ -f "Recon/event_study_v4.py" ]; then
            python Recon/event_study_v4.py
          elif [ -f "event_study_v4.py" ]; then
            python event_study_v4.py
          else
            SCRIPT=$(find. -name "event_study_v4.py" | head -1)
            echo "Found $SCRIPT"
            python "$SCRIPT"
          fi
          ls -lh
      - uses: actions/upload-artifact@v4
        with:
          name: event-study-results
          path: |
            *.csv
            *.json
            **/*.csv
            **/*.json
          if-no-files-found: warn
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update event study results [auto]"
