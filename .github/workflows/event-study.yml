name: RECON Historical Event Study

on:
  workflow_dispatch:

jobs:
  event-study:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance pandas numpy scipy

      - name: Run historical event study
        run: |
          python event_study_v7.py

      - name: Show generated files
        run: |
          echo "=========================================="
          echo "RECON EVENT STUDY OUTPUT"
          echo "=========================================="
          echo ""
          ls -lh \

           event_study_v7.csv
           event_study_v7.json \
           event_study_v7_summary.json \
           event_study_v7_controls.csv \
           event_study_v7_residuals.csv
            
      - name: Commit results
        run: |
          git config user.name "recon-bot"
          git config user.email "recon-bot@users.noreply.github.com"

          git add \
            event_study_events.csv \
            event_study_results.json \
            event_study_summary.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "update historical event study"
            git push
          fi
