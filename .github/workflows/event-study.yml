name: event-study
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/event-study.yml'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install yfinance pandas requests
      - name: Run
        run: python event_study_v7.py || python Recon/event_study_v7.py || python ./event_study_v7.py
      - name: Show files
        run: ls -R
      - name: Commit results
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add .
          git commit -m "update" || true
          git push || true
