name: RECON Historical Event Study
on:
  workflow_dispatch:

jobs:
  event-study:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pandas requests yfinance

      - name: Run historical event study
        run: python Recon/event_study_v4.py

      - name: Show generated files
        run: |
          pwd
          ls -lh
          ls -lh Recon/ || true

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: event-study-results
          path: |
            *.csv
            *.json
            Recon/*.csv
            Recon/*.json

      - name: Commit results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update event study results [auto]"
          file_pattern: "*.csv *.json Recon/*.csv Recon/*.json"
