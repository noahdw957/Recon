name: recon-mts12-B-diagnostic

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install pandas numpy scipy scikit-learn yfinance
      - name: Run 12-factor A freeze and B diagnostic
        run: python recon_mts12_B_diagnostic.py
      - name: Show summary
        run: cat recon_mts12_B_summary.json
      - name: Commit outputs
        run: |
          git config user.name "recon-bot"
          git config user.email "bot@recon.com"
          git add recon_mts12_frozen_A.json recon_mts12_A_thresholds.csv recon_mts12_B_diagnostic.csv recon_mts12_B_summary.json mts12_market_cache/ 2>/dev/null || true
          git commit -m "RECON 12-factor MTS B diagnostic" || echo "Nothing new to commit"
          git push
