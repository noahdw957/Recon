name: recon-scaleaware8-B

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install pandas numpy scikit-learn
      - name: Run new scale-aware Gang-of-8 on B
        run: python recon_scaleaware8_B.py
      - name: Show summary
        run: cat recon_scaleaware8_B_summary.json
      - name: Commit outputs
        run: |
          git config user.name "recon-bot"
          git config user.email "bot@recon.com"
          git add recon_scaleaware8_frozen_A.json recon_scaleaware8_A_thresholds.csv recon_scaleaware8_B_results.csv recon_scaleaware8_B_summary.json
          git commit -m "RECON new scale-aware Gang-of-8 B test" || echo "Nothing new to commit"
          git push
