name: RECON gain benchmark

on:
  workflow_dispatch:
  schedule:
    # 21:30 UTC = 5:30 PM Eastern during daylight time.
    # Runs Monday-Friday, safely after the U.S. market close.
    - cron: "30 21 * * 1-5"

permissions:
  contents: write

jobs:
  update-benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance

      - name: Update RECON benchmark
        run: python track_recon_gain_benchmark.py

      - name: Commit new closing gains
        run: |
          if [ -z "$(git status --porcelain -- projected_gain_benchmark.csv)" ]; then
            echo "No new benchmark row to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projected_gain_benchmark.csv
          git commit -m "Update RECON gain benchmark"
          git push
