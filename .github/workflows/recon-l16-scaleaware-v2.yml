name: recon-l16-scaleaware-v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install pandas numpy scipy scikit-learn
      - name: Run full 15-column scale-aware L16
        run: python recon_L16_scaleaware_v2.py
      - name: Show results
        run: |
          cat recon_L16_scaleaware_v2_effects_A.csv
          echo
          cat recon_L16_scaleaware_v2_summary.json
      - name: Commit outputs
        run: |
          git config user.name "recon-bot"
          git config user.email "bot@recon.com"
          git add recon_L16_scaleaware_v2_input_A.csv recon_L16_scaleaware_v2_runs_A.csv recon_L16_scaleaware_v2_effects_A.csv recon_L16_scaleaware_v2_summary.json 2>/dev/null || true
          git commit -m "RECON scale-aware L16 v2" || echo "Nothing new to commit"
          git push
